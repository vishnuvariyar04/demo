<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    :root {
      --bg-start: #f0f4ff;
      --bg-end: #e6f7ff;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-600: #1d4ed8;
      --error: #ef4444;
      --ring: #93c5fd;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-start), var(--bg-end));
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(2, 6, 23, 0.08);
      padding: 24px;
    }

    .title {
      margin: 0 0 8px 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0 0 20px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      box-sizing: border-box;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 4px rgba(147, 197, 253, 0.35);
    }

    input:invalid:focus {
      border-color: var(--error);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
    }

    .submit {
      width: 100%;
      margin-top: 8px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.02s ease;
    }

    .submit:hover {
      background: var(--primary-600);
    }

    .submit:active {
      transform: translateY(1px);
    }

    .helper {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      .card {
        padding: 18px;
      }
    }
  </style>
  <meta name="color-scheme" content="light dark">
</head>
<body>
  <main class="page">
    <form class="card" action="#" method="post" novalidate>
      <h1 class="title">Login</h1>
      <p class="subtitle">Please enter your details to continue.</p>

      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your full name" autocomplete="name" minlength="2" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="+1 555 123 4567" autocomplete="tel" pattern="^\+?[0-9\s\-()]{7,}$" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" minlength="6" required>
      </div>

      <button class="submit" type="submit">Log in</button>

      <div class="helper">By continuing you agree to our terms and privacy policy</div>
    </form>
  </main>
</body>
</html>
